name: Scan public sources

on:
  schedule:
    - cron: "17 9,21 * * *"
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      max_new:
        description: New eligible source candidates to inspect (all by default)
        type: choice
        options: ["all", "100", "300"]
        default: "all"
      smoke:
        description: Use the collector's small public-source smoke scan
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: public-source-scan
  cancel-in-progress: false

jobs:
  scan:
    if: github.repository == 'reacher-z/Awesome-Jev' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.bundle.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Discover and screen public sources without authentication
        env:
          SCAN_MAX_NEW: ${{ inputs.max_new || 'all' }}
          SCAN_SMOKE: ${{ inputs.smoke && 'true' || 'false' }}
        run: |
          args=()
          if [ "$SCAN_MAX_NEW" != "all" ]; then args+=(--max-new "$SCAN_MAX_NEW"); fi
          if [ "$SCAN_SMOKE" = "true" ]; then args+=(--smoke); fi
          env -u GH_TOKEN -u GITHUB_TOKEN python3 scripts/refresh_sources.py "${args[@]}"
      - name: Validate the complete refreshed repository
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/validate.py
          python3 scripts/build_source_index.py --check
      - name: Package only validated source data
        id: bundle
        if: inputs.smoke != true
        run: python3 scripts/open_scan_pr.py bundle --directory "$RUNNER_TEMP/source-scan-bundle"
      - name: Retain the validated same-run data artifact
        if: steps.bundle.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-scan-bundle
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: scan
    if: github.repository == 'reacher-z/Awesome-Jev' && github.ref == 'refs/heads/main' && needs.scan.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Checkout the trusted workflow commit, never the automation/PR branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: source-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-scan-bundle
      - name: Restore fixed data paths after manifest and run-identity checks
        run: python3 scripts/open_scan_pr.py restore --directory "$RUNNER_TEMP/source-scan-bundle"
      - name: Validate restored data with trusted base-branch code
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/validate.py
          python3 scripts/build_source_index.py --check
      - name: Create or update the single source-scan PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/open_scan_pr.py publish --directory "$RUNNER_TEMP/source-scan-bundle"
